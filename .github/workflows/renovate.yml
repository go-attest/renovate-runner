name: Renovate

on:
  schedule:
    # One slice an hour. A token has five thousand API requests an hour and 685
    # repositories want more, so each slice gets an hour's budget to itself.
    # The hours are the slice numbers below; nothing else derives them.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      slice:
        description: Which slice of the org list to run (1-6)
        default: '1'
      logLevel:
        description: Renovate log level
        default: info
      dryRun:
        description: >-
          Run without writing anything: no branch, no PR. Use this to prove
          a slice works after touching the config, since a config fault only
          ever shows up inside the container.
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Which slice this run takes
        id: slice
        run: |
          case '${{ github.event.schedule }}' in
            '0 5 * * *')  n=1 ;;
            '0 6 * * *')  n=2 ;;
            '0 7 * * *')  n=3 ;;
            '0 8 * * *')  n=4 ;;
            '0 9 * * *')  n=5 ;;
            '0 10 * * *') n=6 ;;
            *)            n='${{ inputs.slice }}' ;;
          esac
          echo "n=${n:-1}" >> "$GITHUB_OUTPUT"
          echo "slice ${n:-1} of 6"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_SLICE: ${{ steps.slice.outputs.n }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Empty on a scheduled run, which is a real one. Renovate ignores
          # the variable when empty; only 'full' suppresses the writes.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
